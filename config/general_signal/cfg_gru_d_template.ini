#!/usr/bin/env python3
# GRU-D baseline. Generated by bin/generate_gru_d_configs.py.
# Not read by bin/train_model.py. Train with bin/train_gru_d.py.

[User]
logger_type = 1
print_model = True
experiment_name = {experiment_name}
test_keys = {test_keys}
saved_root = ./saved_model
data_dir = ./data

[Network]
name = GRU_D
tag = GRU_D
x_dim = {x_dim}
activation = relu
dense_x =
dense_h_x =
dim_rnn = {dim_rnn}
num_rnn = 1
type_rnn = GRU_D
dropout_p = {dropout_p}

[Training]
use_cuda = False
optimization = adam
beta = 1
lr = {lr}
epochs = {epochs}
early_stop_patience = {early_stop_patience}
save_frequency = {save_frequency}
gradient_clip = {gradient_clip}
learn_x_mean = False
delta_step = 1.0
seed = {seed}

[DataFrame]
dataset_name = {dataset_name}
dataset_label = {dataset_label}
mask_label = {mask_label}
shuffle = {shuffle}
batch_size = {batch_size}
num_workers = {num_workers}
sequence_len = {sequence_len}
sample_rate = 1
skip_rate = 1
val_indices = {val_indices}
observation_process = {observation_process}
overlap = False
with_nan = False
