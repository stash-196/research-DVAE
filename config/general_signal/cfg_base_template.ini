#!/usr/bin/env python3
# -*- coding: utf-8 -*-
# Config file for VRNN model
# dense_*** can be empty, that means an Identity layer

[User]
# 1: file model    2: console model   3: both
logger_type = 1
print_model = True
experiment_name = {experiment_name}
test_keys = {test_keys}

[Network]
name = {name}
tag = {tag}
x_dim = {x_dim}
z_dim = {z_dim}
activation = {activation}
dense_x = {dense_x}
dense_z = {dense_z}
dense_h_x =
dense_hx_z =
dense_hz_x =
dense_h_z =
dim_rnn = {dim_rnn}
hidden_sh_size = {hidden_sh_size}
num_rnn = 1
type_rnn = {type_rnn}
dropout_p = {dropout_p}
alphas = {alphas}
; Heart/brain split of the recurrent map. Blank, off, or false = off.
; true, on, or half splits dim_rnn in half. An odd width gives the
; extra unit to the brain block. a,b must sum to dim_rnn. The input
; matrix is not split. Off-block recurrent entries are zero unless
; hidden_block_weak_coupling is true (then multiplied by 0.01) or a
; factor in (0, 1]. Decoder cross terms stay zero. ecg_channels and
; eeg_channels are required 0-based indices when the split is on.
; Blank, off, or none means unset. 0 is channel 0, not off.
; dense_h_x must stay empty. num_rnn must be 1.
hidden_block_split = {hidden_block_split}
hidden_block_weak_coupling = {hidden_block_weak_coupling}
ecg_channels = {ecg_channels}
eeg_channels = {eeg_channels}
; Per-block MT-RNN alphas. Blank keeps the shared alphas list. A
; comma list is tiled inside the block. The range keys are min,max
; spread across that block. PLRNN diagonal A is unchanged.
heart_alphas = {heart_alphas}
brain_alphas = {brain_alphas}
heart_alpha_range = {heart_alpha_range}
brain_alpha_range = {brain_alpha_range}

[Training]
use_cuda = True
optimization = adamW
beta = 1
lr = {lr}
alpha_lr = {alpha_lr}
epochs = {epochs}
early_stop_patience = {early_stop_patience}
; Warm-up phase order. Blank = window_first: grow sequence_len to the
; target first while staying at auto_warm_start (full teacher forcing).
; Those window bumps do not reset autonomous, noise, or KL. Then
; autonomous and noise run once, at the full length, then KL.
; auto_first is the previous nested order: a full autonomous ramp, then
; KL, at every window length. A window bump resets those warm-ups.
; legacy_defaults = true (or legacy_windowing = true) selects auto_first
; when this key is blank. An explicit value wins.
warmup_order = {warmup_order}
; Fraction of early_stop_patience used as the warm-up start when
; warmup_patience_start is blank. Blank = 0.2. The start is
; max(1, round(this fraction times early_stop_patience)).
warmup_patience_start_frac = {warmup_patience_start_frac}
; Explicit start patience. Blank uses the fraction above. A number
; here overrides the fraction. off, or legacy_defaults = true with
; this key blank, keeps a single early_stop_patience. auto_first does
; the same. In window_first the start is held for every
; sequence-length bump, then rises over the autonomous and KL bumps:
; start + (early_stop_patience - start) * k / K, where k is how many
; of those bumps have already fired and K is how many are planned.
; The final stop always uses early_stop_patience. If there are no
; autonomous or KL bumps, window bumps use the start and the stop
; uses the full patience.
warmup_patience_start = {warmup_patience_start}
save_frequency = {save_frequency}
gradient_clip = {gradient_clip}
optimize_alphas = {optimize_alphas}
sampling_method = {sampling_method}
sampling_ratio = {sampling_ratio}
mask_autonomous_filled = {mask_autonomous_filled}
auto_warm_start = {auto_warm_start}
loss_mask_mode = {loss_mask_mode}
noise_init_ratio = {noise_init_ratio}
noise_mix_ratio = {noise_mix_ratio}
noise_std_factor = {noise_std_factor}
noise_target = {noise_target}
noise_sampling_method = {noise_sampling_method}
tie_noise_to_auto = {tie_noise_to_auto}
noise_warm_reset_on_window = {noise_warm_reset_on_window}
noise_window_size = {noise_window_size}
; Subband spectrum loss. subband_loss_weight blank, 0, or off = off.
; Differentiable rFFT. MSE of power normalised inside the band.
; subband_channels uses the same rule as ecg_channels: blank,
; off, or none is unset, and 0 is channel 0. subband_low_hz = 0 is
; 0 Hz, not off. subband_high_hz blank = Nyquist. subband_loss_warmup true
; ramps the weight from 0 across the autonomous and KL bumps:
; bumps already done, divided by autonomous steps plus KL steps.
; The ratio is 1 when warmup is off or that sum is 0. The train
; log line keeps tot, recon, and KL, and adds subband and decorr.
; tot is the total that was backpropagated, including those terms.
; When a term is on, its warm-up scale and effective weight are stored
; with the other warm-up series and drawn on the warm-up panel. Bump
; lines mark scale changes. A disabled term is left off that panel.
subband_loss_weight = {subband_loss_weight}
subband_loss_warmup = {subband_loss_warmup}
subband_channels = {subband_channels}
subband_fs = {subband_fs}
subband_low_hz = {subband_low_hz}
subband_high_hz = {subband_high_hz}
; Decorrelation penalty. Blank, 0, or off = off. mode hidden is the
; cross-correlation of the heart and brain hidden blocks and needs
; the split above. mode output is the off-diagonal block between two
; 0-based channel groups written as 0,1|2,3. Same warmup rule.
decorr_loss_weight = {decorr_loss_weight}
decorr_loss_warmup = {decorr_loss_warmup}
decorr_mode = {decorr_mode}
decorr_groups = {decorr_groups}
; Best-model / early-stop criteria, comma-separated. This list chooses
; the checkpoint only. The validation figure always plots raw recon, the
; spectrum error, and the Appendix B terms base_error, auto_drift,
; error_drift_cross, and error_drift_total, plus recon_k behind the
; total, the finite-time exponent, and Rosenstein LLE when it is on.
; The selection score is added when more than one entry is listed.
; Blank = recon,spectrum. Selectable names are recon, spectrum,
; base_error, auto_drift, error_drift_cross, error_drift_total,
; recon_k, base_error_varnorm, auto_drift_varnorm,
; error_drift_cross_varnorm, error_drift_total_varnorm,
; auto_drift_k1, auto_drift_k5, auto_drift_k, ftle, rosenstein_lle.
; drift, cross, and auto_total are aliases of auto_drift,
; error_drift_cross, and error_drift_total.
; error_drift_cross and error_drift_cross_varnorm enter the score as
; the absolute cross. ftle and rosenstein_lle enter as the absolute
; distance to the ground-truth Lyapunov exponent. The plotted cross
; stays signed. Each selected term is divided by its value at the first
; validation epoch and the sum is the selection score. Lower is better.
; A single entry is not normalised.
; val_criteria = recon keeps the historical raw val_loss comparison.
; DataFrame legacy_defaults = true (legacy_windowing is the same switch)
; does the same when this key is blank, and then does not build the
; spectrum windows unless spectrum or a drift term is explicitly selected.
val_criteria = {val_criteria}
; Spectrum-check windows, also used for the drift terms and Lyapunov.
; Blank keeps 10, 2000, and 1000. Chosen once at training start, inside
; one segment, starting on an observed sample. The teacher-forced prefix
; must have observed fraction >= val_window_tf_min_observed and no
; missing run longer than val_window_tf_max_gap_frac of tf_steps.
; Blank keeps 0.95 and 0.01. The draw uses a fixed seed. If fewer than
; n_windows qualify, the best-ranked windows are kept and a warning
; lists their stats. Built even when spectrum is not selected.
; legacy_defaults = true skips them unless spectrum or a drift term
; is selected. Log-y drift panels use a symlog axis. linthresh is the
; 10th percentile of the finite absolute cross on that panel, and at
; least 1e-4, so a negative error_drift_cross keeps its sign. The
; plotted series is not replaced by its absolute value.
val_spectrum_n_windows = {val_spectrum_n_windows}
val_spectrum_window_len = {val_spectrum_window_len}
val_spectrum_tf_steps = {val_spectrum_tf_steps}
val_window_tf_min_observed = {val_window_tf_min_observed}
val_window_tf_max_gap_frac = {val_window_tf_max_gap_frac}
; First K steps after the teacher-forced flip. Blank = 60. Fixed once
; training starts, with the windows and the flip. Must be >= 5 and must
; fit in the free-run tail. auto_drift is logged at k = 1, 5, and K.
; recon_k is the autonomous MSE on those same K entries.
val_drift_horizon = {val_drift_horizon}
; Finite-time exponent: slope of log ||d_k|| versus k. Blank = 1 through K.
; k = 1 is the first step after the flip.
val_ftle_fit_start = {val_ftle_fit_start}
val_ftle_fit_end = {val_ftle_fit_end}
; Rosenstein LLE on the free-run half of each window, mean and std,
; plus the ground-truth exponent once. Blank = true. false / off skips
; it and still computes the finite-time exponent. Both exponents share
; one subplot: the finite-time slope, the Rosenstein mean with the
; across-window std as a band, and the ground-truth line. Per-window
; values are stored as val_ftle_per_window, val_lle_per_window, and
; val_lle_gt_per_window. Drift-term figures are saved raw and
; variance-normalised. The variance-normalised files use a _varnorm
; suffix. The replot CLI --drift-norm chooses raw, varnorm, or both.
; Epoch wall time, the selection score, and warm-up bumps are always
; logged. There is no off switch. Wall time is train, validation recon,
; the fixed-window forward, spectrum, drift, Rosenstein, plotting, and
; the eval run inside training. A bump line records epoch, type
; (window, auto, noise, or KL), old and new value, active patience
; before and after, and cpt_patience. The same rows are stored as
; bump_events so the warm-up vertical lines can be rebuilt.
val_rosenstein = {val_rosenstein}
; Extra checkpoints of the current epoch (model_epochK.pt).
; 0, off, or blank = off (best checkpoint and final file are unchanged).
checkpoint_every_n_epochs = {checkpoint_every_n_epochs}


[DataFrame]
dataset_name = {dataset_name}
dataset_label = {dataset_label}
mask_label = {mask_label}
; XhroProper only. None/empty keeps packet-loss:
;   xhro_packet_loss/grok_output/<dataset_label>_<variant>
; corpus = multi uses suntory/xhro_dataset_v2/grok_output/<dataset_label>
; (no _realtime/_retrans suffix; mask_label ignored).
; data_root replaces that parent (absolute, or relative to data_dir).
corpus = {corpus}
data_root = {data_root}
s_dim = {s_dim}
shuffle = {shuffle}
batch_size = {batch_size}
num_workers = {num_workers}
sequence_len = {sequence_len}
sample_rate = 1
skip_rate = 1
val_indices = {val_indices}
observation_process = {observation_process}
overlap = False
; XhroProper coarse modes. usable_tail holds out 20% of jointly usable
; epochs; last20_rows matches the waveform tail. Empty = usable_tail.
coarse_test_split = {coarse_test_split}
; Optional EEG artifact mask. none/empty = off.
; log_total_power_robust requires coarse_eeg_artifact_k.
; coarse_eeg_max_rel_delta is an extra cap (empty = off).
coarse_eeg_artifact_mask = {coarse_eeg_artifact_mask}
coarse_eeg_artifact_k = {coarse_eeg_artifact_k}
coarse_eeg_max_rel_delta = {coarse_eeg_max_rel_delta}
; Modes that include hr_mean_bpm raise unless this is true, and then
; warn. That column is XHRO's ECG heart rate and is unreliable.
; coarse_eeg_acc and coarse_eeg_acc_tod omit it. Blank = false.
coarse_include_hr = {coarse_include_hr}
; XhroProper waveform only. Inclusive seconds from the first timestamp,
; applied after load and before the test split. Blank = no crop.
crop_start_sec = {crop_start_sec}
crop_end_sec = {crop_end_sec}
; Filled gaps longer than this many seconds become window splits.
; Blank = keep filled gaps as NaN inside windows.
; The split indices are reused on every sequence-length re-cut.
max_fill_gap_sec = {max_fill_gap_sec}
; Re-cut log cutoff for filled NaN runs when max_fill_gap_sec is blank.
; Blank = the log reports long_filled_windows=na.
filled_nan_log_sec = {filled_nan_log_sec}
; legacy_defaults = true restores the previous window placement,
; recon-only selection when val_criteria is blank, auto_first warm-up
; when warmup_order is blank, and a single early_stop_patience when
; warmup_patience_start is blank. legacy_windowing is the same switch.
; Either name set to true turns it on.
; true: blank start_on_observed is false, blank strict_non_overlap is
; false (historical find_indices, local RandomState 1234567890), and
; blank max_gap_window_frac / max_window_nan_ratio / max_window_nan_excess
; mean off (no fraction split and no NaN filter).
; An explicit value for one of those keys, or an explicit val_criteria
; or warm-up key, still wins. Blank = false.
legacy_defaults = {legacy_defaults}
legacy_windowing = {legacy_windowing}
; A contiguous missing run (NaN or present=false) splits the sequence.
; The logged threshold is max(this fraction of the current sequence
; length, the gap_split_quantile length). A run that is not strictly
; longer than the fraction stays. When the quantile is above that
; fraction, a run splits if it is at least the quantile, so a lone run
; (its own quantile) that is longer than the fraction is cut. A run
; longer than the fraction but shorter than a higher quantile of other
; runs stays. Recomputed on every re-cut. Blank = 0.25. off disables
; the split.
; legacy_defaults = true disables it when this key is blank.
; max_fill_gap_sec still applies on its own. Lorenz and SHO use the
; same rule when legacy_defaults is false.
max_gap_window_frac = {max_gap_window_frac}
; Quantile of contiguous missing-run lengths in the loaded series.
; 0.99 is the default. Empty or none disables this term, so the split
; uses only max_gap_window_frac times the sequence length.
gap_split_quantile = 0.99
; true: a start on present=false, or on an all-NaN row when present is
; absent, moves forward to the next observed sample in the same segment.
; The window must still fit there. Windows may contain later gaps.
; Blank = true.
start_on_observed = {start_on_observed}
; true: non-overlapping windows tile each segment. The only unused
; samples are the remainder shorter than the sequence length, and a gap
; that start_on_observed steps over. Blank = true.
; false is the historical find_indices placement.
strict_non_overlap = {strict_non_overlap}
; Absolute NaN-fraction cap. Blank uses the relative rule below instead
; of a fixed 0.3. off disables the NaN filter, including the relative
; rule. A number overrides that rule. The ratio is a float64 mean, so
; a fraction just above the cap is dropped. The long-sequence training
; figure uses this same threshold and does not pin its own 0.3.
max_window_nan_ratio = {max_window_nan_ratio}
; Added to the dataset missing rate. A window is dropped when its NaN
; fraction is above that sum. The rate is computed once after the block
; mask and the time crop, before windowing, from NaN and present=false
; only (not training-time masks). Blank = 0.2. off disables the relative
; rule. A sum >= 1 drops nothing. legacy_defaults = true disables this
; and the absolute cap when max_window_nan_ratio is blank.
max_window_nan_excess = {max_window_nan_excess}
; Path to a block-mask npz. Blank = no masking. Applied before the time
; crop, and the same file is used for realtime and retrans.
; t0 is block starts in session seconds. Block length is the t0 spacing.
; The sample rate is the series median rate. A flagged block covers rows
; from fs*t0 up to but not including fs*(t0+block). Uncovered rows stay
; unflagged. Masked rows become NaN and present=false.
block_mask_file = {block_mask_file}
; not_good (default), dirty, lowamp, or dirty_or_lowamp. Blank = not_good.
block_mask_mode = {block_mask_mode}

[Evaluation]
; Per-dimension W1, sliced Wasserstein, and Rosenstein LLE.
; Blank = true. false skips those scores and the exact POT EMD that
; runs in the same pass. Jacobian Lyapunov stays off unless
; compute_lyapunov is set.
compute_emd_rosenstein = {compute_emd_rosenstein}