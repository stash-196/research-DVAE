#!/usr/bin/env python3
# -*- coding: utf-8 -*-
# Config file for VRNN model
# dense_*** can be empty, that means an Identity layer

[User]
# 1: file model    2: console model   3: both
logger_type = 1
print_model = True
experiment_name = {experiment_name}
test_keys = {test_keys}

[Network]
name = {name}
tag = {tag}
x_dim = {x_dim}
z_dim = {z_dim}
activation = {activation}
dense_x = {dense_x}
dense_z = {dense_z}
dense_h_x =
dense_hx_z =
dense_hz_x =
dense_h_z =
dim_rnn = {dim_rnn}
hidden_sh_size = {hidden_sh_size}
num_rnn = 1
type_rnn = {type_rnn}
dropout_p = {dropout_p}
alphas = {alphas}

[Training]
use_cuda = True
optimization = adamW
beta = 1
lr = {lr}
alpha_lr = {alpha_lr}
epochs = {epochs}
early_stop_patience = {early_stop_patience}
save_frequency = {save_frequency}
gradient_clip = {gradient_clip}
optimize_alphas = {optimize_alphas}
sampling_method = {sampling_method}
sampling_ratio = {sampling_ratio}
mask_autonomous_filled = {mask_autonomous_filled}
auto_warm_start = {auto_warm_start}
loss_mask_mode = {loss_mask_mode}
noise_init_ratio = {noise_init_ratio}
noise_mix_ratio = {noise_mix_ratio}
noise_std_factor = {noise_std_factor}
noise_target = {noise_target}
noise_sampling_method = {noise_sampling_method}
tie_noise_to_auto = {tie_noise_to_auto}
noise_warm_reset_on_window = {noise_warm_reset_on_window}
noise_window_size = {noise_window_size}
; Best-model / early-stop criteria, comma-separated.
; Blank = recon,spectrum. Each term is divided by its value at the first
; validation epoch and the sum is the selection score. Lower is better.
; Spectrum uses 10 windows of length 2000, with 1000 teacher-forced steps,
; unless the three keys below say otherwise.
; val_criteria = recon keeps the historical raw val_loss comparison.
; DataFrame legacy_windowing = true does the same when this key is blank.
; A single entry is not normalised. spectrum alone stays a raw spectral error.
val_criteria = {val_criteria}
; Used only when spectrum is listed. Blank keeps 10, 2000, and 1000.
val_spectrum_n_windows = {val_spectrum_n_windows}
val_spectrum_window_len = {val_spectrum_window_len}
val_spectrum_tf_steps = {val_spectrum_tf_steps}
; Extra checkpoints of the current epoch (model_epochK.pt).
; 0, off, or blank = off (best checkpoint and final file are unchanged).
checkpoint_every_n_epochs = {checkpoint_every_n_epochs}


[DataFrame]
dataset_name = {dataset_name}
dataset_label = {dataset_label}
mask_label = {mask_label}
; XhroProper only. None/empty keeps packet-loss:
;   xhro_packet_loss/grok_output/<dataset_label>_<variant>
; corpus = multi uses suntory/xhro_dataset_v2/grok_output/<dataset_label>
; (no _realtime/_retrans suffix; mask_label ignored).
; data_root replaces that parent (absolute, or relative to data_dir).
corpus = {corpus}
data_root = {data_root}
s_dim = {s_dim}
shuffle = {shuffle}
batch_size = {batch_size}
num_workers = {num_workers}
sequence_len = {sequence_len}
sample_rate = 1
skip_rate = 1
val_indices = {val_indices}
observation_process = {observation_process}
overlap = False
; XhroProper coarse modes. usable_tail holds out 20% of jointly usable
; epochs; last20_rows matches the waveform tail. Empty = usable_tail.
coarse_test_split = {coarse_test_split}
; Optional EEG artifact mask. none/empty = off.
; log_total_power_robust requires coarse_eeg_artifact_k.
; coarse_eeg_max_rel_delta is an extra cap (empty = off).
coarse_eeg_artifact_mask = {coarse_eeg_artifact_mask}
coarse_eeg_artifact_k = {coarse_eeg_artifact_k}
coarse_eeg_max_rel_delta = {coarse_eeg_max_rel_delta}
; XhroProper waveform only. Inclusive seconds from the first timestamp,
; applied after load and before the test split. Blank = no crop.
crop_start_sec = {crop_start_sec}
crop_end_sec = {crop_end_sec}
; Filled gaps longer than this many seconds become window splits.
; Blank = keep filled gaps as NaN inside windows.
; The split indices are reused on every sequence-length re-cut.
max_fill_gap_sec = {max_fill_gap_sec}
; Re-cut log cutoff for filled NaN runs when max_fill_gap_sec is blank.
; Blank = the log reports long_filled_windows=na.
filled_nan_log_sec = {filled_nan_log_sec}
; Filled gap with more samples than this fraction of the current sequence
; length becomes a split. Recomputed on every re-cut. Blank = off.
; max_fill_gap_sec still applies on its own.
max_gap_window_frac = {max_gap_window_frac}
; true: a start on present=false, or on an all-NaN row when present is
; absent, moves forward to the next observed sample in the same segment.
; The window must still fit there. Windows may contain later gaps.
; Blank = false.
start_on_observed = {start_on_observed}
; true: non-overlapping windows tile each segment. The only unused
; samples are the remainder shorter than the sequence length, and a gap
; that start_on_observed steps over. Blank = false, the historical
; find_indices placement (local RandomState 1234567890).
strict_non_overlap = {strict_non_overlap}
; Drop a window whose NaN fraction is above this. Blank = no filtering.
; The long-sequence training figure still passes its own 0.3 threshold.
max_window_nan_ratio = {max_window_nan_ratio}