#!/usr/bin/env python3
# Professor Forcing on Lorenz63. Consumed by bin/train_professor_forcing.py,
# not by bin/train_model.py. The comparison grid is written by
# bin/generate_professor_forcing_configs.py (epochs and masks differ there).

[User]
experiment_name = professor_forcing_lorenz63

[Model]
variant = professor_forcing
behavior = pre_tanh
generator_objective = nll_cf
free_run_feedback = mean
observation_std = 1.0
hidden_size = 64
disc_hidden_size = 64
logit_clip = 10.0
hidden_match_weight = 1.0
x_dim = 1

[Training]
lr = 0.0001
disc_lr = 0.0001
epochs = 50
early_stop_patience = 10
gradient_clip = 5.0
acc_low = 0.75
acc_high = 0.99
eval_every = 5
max_eval_batches = 4
max_train_batches = 0
seed = 0
use_cuda = True

[DataFrame]
dataset_name = Lorenz63
dataset_label = sigma10_rho28_beta8d3_N108k_dt0.01
mask_label = None
observation_process = only_x
sequence_len = 200
batch_size = 64
val_indices = 0.2
shuffle = True
num_workers = 0
