#!/usr/bin/env python3
# -*- coding: utf-8 -*-
# SMOKE config: Hess/Durstewitz shPLRNN cell via type_rnn (no GTF).
# Train later with: python bin/train_model.py --cfg config/lorenz63/cfg_sh_plrnn.ini
# Knobs: Network.name=RNN, type_rnn=shPLRNN, dim_rnn=M, hidden_sh_size=L (typically L >= M).
# dense_x / dense_h_x empty → identity read-in / linear read-out (same as other latent RNNs).
# Existing TF / sampling_ratio / OTF hooks apply; GTF is not implemented.

[User]
# 1: file model    2: console model   3: both
logger_type = 1
print_model = True
experiment_name = smoke_shplrnn_lorenz63
test_keys = 

[Network]
name = RNN
tag = shPLRNN
x_dim = 1
z_dim = 
activation = relu
dense_x = 
dense_z = 
dense_h_x = 
dense_hx_z =
dense_hz_x =
dense_h_z =
dim_rnn = 8
hidden_sh_size = 16
num_rnn = 1
type_rnn = shPLRNN
dropout_p = 0
alphas = 

[Training]
use_cuda = True
optimization = adamW
beta = 1
lr = 0.001
alpha_lr = 0.01
epochs = 10
early_stop_patience = 5
save_frequency = 5
gradient_clip = 0
optimize_alphas = False
sampling_method = ss
sampling_ratio = 0.3
mask_autonomous_filled = False
loss_mask_mode = none
auto_warm_start = 0.0

[DataFrame]
dataset_name = Lorenz63
dataset_label = sigma10_rho28_beta8d3_N108k_dt0.01
mask_label = None
s_dim = 1
shuffle = True
batch_size = 16
num_workers = 0
sequence_len = 50
sample_rate = 1
skip_rate = 1
val_indices = 0.2
observation_process = only_x
overlap = False
