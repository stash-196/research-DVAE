#!/usr/bin/env python3
# Hand-written GRU-D example for Lorenz63, fully observed xyz.
# Train: python bin/train_gru_d.py --cfg config/lorenz63/cfg_gru_d.ini
# On Deigo, device_paths.yaml replaces data_dir and saved_root.
# Sweeps belong in bin/generate_gru_d_configs.py, not in
# bin/generate_config_file_for_multiple.py.

[User]
logger_type = 1
print_model = True
experiment_name = gru_d_lorenz63_example
saved_root = ./saved_model
data_dir = ./data

[Network]
name = GRU_D
tag = GRU_D
x_dim = 3
activation = relu
dense_x =
dense_h_x =
dim_rnn = 32
num_rnn = 1
type_rnn = GRU_D
dropout_p = 0

[Training]
use_cuda = False
optimization = adam
beta = 1
lr = 0.001
epochs = 50
early_stop_patience = 10
save_frequency = 25
gradient_clip = 1.0
learn_x_mean = False
delta_step = 1.0
seed = 0

[DataFrame]
dataset_name = Lorenz63
dataset_label = sigma10_rho28_beta8d3_N108k_dt0.01
mask_label = None
shuffle = True
batch_size = 64
num_workers = 0
sequence_len = 200
sample_rate = 1
skip_rate = 1
val_indices = 0.2
observation_process = all_xyz
overlap = False
with_nan = False
